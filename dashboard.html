<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسار | لوحة التحكم</title>

<style>
body{
margin:0;
background:#f5f6fa;
color:#202124;
font-family:Arial,sans-serif
}
.wrap{
max-width:1000px;
margin:auto;
padding:20px
}
.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px
}
h1{margin:0}
.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin-bottom:20px
}
.card{
background:#fff;
border-radius:14px;
padding:20px;
box-shadow:0 2px 10px #00000012;
margin-bottom:16px
}
.num{
font-size:30px;
font-weight:bold;
margin-top:8px
}
.muted{color:#777}
input,button{
width:100%;
box-sizing:border-box;
padding:14px;
margin-top:10px;
border-radius:8px;
font-size:16px
}
input{border:1px solid #ddd}
button{
border:0;
background:#222;
color:#fff;
cursor:pointer
}
.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.customer{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #eee;
padding:12px 0
}
.points{
font-weight:bold;
font-size:20px
}
#status{
margin-top:12px;
font-weight:bold
}
.history-item{
border-top:1px solid #eee;
padding:12px 0
}
.add{font-weight:bold}
.remove{font-weight:bold}

@media(max-width:650px){
.grid{grid-template-columns:1fr}
.row{grid-template-columns:1fr}
.top{display:block}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
<div class="muted">مسار • لوحة التحكم</div>
<h1>مسار التجريبي</h1>
</div>

<div class="grid">

<div class="card">
<div class="muted">عدد الزبائن</div>
<div class="num" id="count">0</div>
</div>

<div class="card">
<div class="muted">إجمالي النقاط</div>
<div class="num" id="total">0</div>
</div>

<div class="card">
<div class="muted">المكافأة القادمة</div>
<div class="num">100</div>
</div>

</div>

<div class="card">

<h2>إضافة زبون / تحديث نقاط</h2>

<input id="name" placeholder="اسم الزبون">

<input id="phone" placeholder="رقم الهاتف" inputmode="tel">

<input id="points" type="number" min="1" placeholder="عدد النقاط">

<div class="row">

<button onclick="changePoints(1)">
إضافة نقاط
</button>

<button onclick="changePoints(-1)">
خصم نقاط
</button>

</div>

<div id="status"></div>

</div>

<div class="card">

<h2>الزبائن</h2>

<div id="list">
جاري التحميل...
</div>

</div>

<div class="card">

<h2>آخر عمليات النقاط</h2>

<div id="history">
جاري التحميل...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://zobsoaasyuqtqniwfcyd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nYrJznGU551mw5fMvr6oZA_AySYi2E7";

const SHOP_ID = 1;


/* =========================
   Supabase
========================= */

async function supabaseRequest(path, options = {}){

const response = await fetch(
SUPABASE_URL + "/rest/v1/" + path,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY,
"Content-Type":"application/json",
"Accept":"application/json",
...(options.headers || {})
}
}
);

const text = await response.text();

let data = null;

try{
data = text ? JSON.parse(text) : null;
}catch{
data = text;
}

if(!response.ok){

throw new Error(
typeof data === "string"
? data
: JSON.stringify(data)
);

}

return data;

}


/* =========================
   الزبائن
========================= */

async function render(){

const list =
document.getElementById("list");

try{

const customers =
await supabaseRequest(
"customers" +
"?select=id,name,phone,points,created_at" +
"&shop_id=eq." + SHOP_ID +
"&order=id.desc"
);

document.getElementById("count")
.textContent = customers.length;

let total = 0;

customers.forEach(customer=>{
total += Number(customer.points || 0);
});

document.getElementById("total")
.textContent = total;

if(!customers.length){

list.innerHTML =
"لا يوجد زبائن حالياً";

return;

}

list.innerHTML =
customers.map(customer=>`

<div class="customer">

<div>

<strong>
${escapeHtml(customer.name || "")}
</strong>

<div class="muted">
${escapeHtml(customer.phone || "")}
</div>

</div>

<div class="points">
${Number(customer.points || 0)} نقطة
</div>

</div>

`).join("");

}catch(error){

console.error(error);

list.innerHTML =
"<b>تعذر تحميل الزبائن</b><br>" +
escapeHtml(error.message);

}

}


/* =========================
   سجل العمليات
========================= */

async function loadHistory(){

const history =
document.getElementById("history");

try{

const rows =
await supabaseRequest(
"points_history" +
"?select=id,created_at,customer_id,customer_name,customer_phone,points,action" +
"&shop_id=eq." + SHOP_ID +
"&order=id.desc" +
"&limit=30"
);

if(!rows.length){

history.innerHTML =
"لا توجد عمليات بعد";

return;

}

history.innerHTML =
rows.map(row=>{

const isAdd =
row.action === "add";

const text =
isAdd ? "إضافة" : "خصم";

const sign =
isAdd ? "+" : "-";

return `

<div class="history-item">

<strong>
${escapeHtml(
row.customer_name || "بدون اسم"
)}
</strong>

<div class="muted">
${escapeHtml(
row.customer_phone || "بدون رقم"
)}
</div>

<div>
${text}:
<b>
${sign}${Number(row.points || 0)}
</b>
نقطة
</div>

</div>

`;

}).join("");

}catch(error){

console.error(error);

history.innerHTML =
"<b>تعذر تحميل سجل العمليات</b><br>" +
escapeHtml(error.message);

}

}


/* =========================
   إضافة / خصم
========================= */

async function changePoints(direction){

const name =
document.getElementById("name")
.value.trim();

const phone =
document.getElementById("phone")
.value.trim();

const value =
Number(
document.getElementById("points")
.value
);

const status =
document.getElementById("status");


if(!name || !phone || !value || value <= 0){

status.textContent =
"اكتب الاسم ورقم الهاتف وعدد النقاط";

return;

}

status.textContent =
"جاري الحفظ...";


try{

/* =========================
   البحث عن الزبون
========================= */

const found =
await supabaseRequest(
"customers" +
"?select=id,name,phone,points" +
"&shop_id=eq." + SHOP_ID +
"&phone=eq." +
encodeURIComponent(phone) +
"&limit=1"
);

let customer;


/* =========================
   زبون موجود
========================= */

if(found.length > 0){

customer = found[0];

const oldPoints =
Number(customer.points || 0);

const newPoints =
Math.max(
0,
oldPoints + (direction * value)
);


/* تحديث النقاط */

await supabaseRequest(
"customers?id=eq." + customer.id,
{
method:"PATCH",

headers:{
"Prefer":"return=representation"
},

body:JSON.stringify({
points:newPoints
})
}
);

customer.points = newPoints;

}


/* =========================
   زبون جديد
========================= */

else{

if(direction < 0){

status.textContent =
"الزبون غير موجود، لا يمكن خصم نقاط.";

return;

}

const inserted =
await supabaseRequest(
"customers",
{
method:"POST",

headers:{
"Prefer":"return=representation"
},

body:JSON.stringify({

shop_id:SHOP_ID,

name:name,

phone:phone,

points:value

})
}
);

customer = inserted[0];

}


/* =========================
   الاسم والرقم
========================= */

const historyName =
customer.name || name;

const historyPhone =
customer.phone || phone;


/* =========================
   حفظ سجل العملية
========================= */

const historyResult =
await supabaseRequest(
"points_history",
{
method:"POST",

headers:{
"Prefer":"return=representation"
},

body:JSON.stringify({

shop_id:SHOP_ID,

customer_id:customer.id,

customer_name:historyName,

customer_phone:historyPhone,

points:value,

action:
direction === 1
? "add"
: "remove"

})
}
);


/* التأكد أن السجل انحفظ */

if(!historyResult){

throw new Error(
"تم تحديث النقاط لكن لم يتم تأكيد حفظ سجل العملية."
);

}


/* =========================
   نجاح
========================= */

status.textContent =
direction === 1
? "✅ تمت إضافة النقاط وحفظ السجل"
: "✅ تم خصم النقاط وحفظ السجل";

document.getElementById("points")
.value = "";

await render();

await loadHistory();


}catch(error){

console.error(error);

status.innerHTML =
"❌ حدث خطأ:<br>" +
escapeHtml(error.message);

}

}


/* =========================
   حماية النص
========================= */

function escapeHtml(value){

return String(value)

.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* =========================
   تشغيل
========================= */

async function start(){

await render();

await loadHistory();

}

start();

</script>

</body>
</html>
