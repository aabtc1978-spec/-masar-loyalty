<!doctype html>
<html lang="ar" dir="rtl">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>مسار | لوحة صاحب المحل</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  background:#f5f6fa;
  color:#202124;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1{
  margin:0 0 20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card{
  background:white;
  border-radius:12px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #ddd;
}

.num{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

input,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:16px;
}

button{
  border:0;
  background:#111;
  color:white;
  cursor:pointer;
}

button.add{
  background:#198754;
}

button.minus{
  background:#dc3545;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.customer{
  background:#fafafa;
  padding:12px;
  border-radius:8px;
  margin-top:8px;
}

.muted{
  color:#777;
}

@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }

  .row{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<h1>محل مسار التجريبي</h1>

<div class="grid">

<div class="card">
<div class="muted">عدد الزبائن</div>
<div class="num" id="count">0</div>
</div>

<div class="card">
<div class="muted">إجمالي النقاط</div>
<div class="num" id="total">0</div>
</div>

<div class="card">
<div class="muted">المكافأة القادمة</div>
<div class="num">100</div>
</div>

</div>

<div class="card">

<h2>إضافة / تحديث نقاط زبون</h2>

<input id="name" placeholder="اسم الزبون">

<input id="phone" placeholder="رقم الهاتف">

<input id="points" type="number" placeholder="عدد النقاط">

<div class="row">

<button class="add" onclick="changePoints(1)">
إضافة نقاط
</button>

<button class="minus" onclick="changePoints(-1)">
خصم نقاط
</button>

</div>

</div>

<div class="card">

<h2>الزبائن</h2>

<div id="list">جاري التحميل...</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://zobsoaasyuqtqniwfcy d.supabase.co".replace(" ","");

const SUPABASE_KEY =
"ضع_هنا_مفتاح_Supabase_الخاص_بك";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* تحميل الزبائن */

async function loadCustomers(){

  const { data, error } = await db
    .from("customers")
    .select("*")
    .order("id", { ascending:false });

  if(error){

    console.error(error);

    document.getElementById("list").innerHTML =
      "خطأ: " + error.message;

    return;
  }

  let customers = data || [];

  document.getElementById("count").textContent =
    customers.length;

  let total = customers.reduce(
    (sum,c) => sum + Number(c.points || 0),
    0
  );

  document.getElementById("total").textContent =
    total;

  if(customers.length === 0){

    document.getElementById("list").innerHTML =
      "لا يوجد زبائن حتى الآن";

    return;
  }

  document.getElementById("list").innerHTML =
    customers.map(c => `
      <div class="customer">
        <b>${escapeHtml(c.name || "")}</b>
        <br>
        📱 ${escapeHtml(c.phone || "")}
        <br>
        ⭐ النقاط:
        <b>${Number(c.points || 0)}</b>
      </div>
    `).join("");
}


/* إضافة أو خصم النقاط */

async function changePoints(direction){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const points =
    Number(document.getElementById("points").value);

  if(!name || !phone || !points){

    alert("ادخل الاسم والرقم والنقاط");

    return;
  }

  if(points <= 0){

    alert("عدد النقاط يجب أن يكون أكبر من صفر");

    return;
  }


  /* البحث عن الزبون */

  const { data: existing, error: findError } =
    await db
      .from("customers")
      .select("*")
      .eq("phone", phone)
      .maybeSingle();


  if(findError){

    alert("خطأ في البحث: " + findError.message);

    console.error(findError);

    return;
  }


  /* إذا الزبون موجود */

  if(existing){

    let newPoints =
      Number(existing.points || 0) +
      (direction * points);

    if(newPoints < 0){
      newPoints = 0;
    }

    const { error } =
      await db
        .from("customers")
        .update({
          name:name,
          points:newPoints
        })
        .eq("id", existing.id);


    if(error){

      alert("فشل تحديث النقاط: " + error.message);

      console.error(error);

      return;
    }

  }

  /* إذا الزبون غير موجود */

  else{

    let newPoints =
      direction === 1 ? points : 0;

    const { error } =
      await db
        .from("customers")
        .insert({
          name:name,
          phone:phone,
          points:newPoints
        });


    if(error){

      alert("فشل إضافة الزبون: " + error.message);

      console.error(error);

      return;
    }
  }


  document.getElementById("points").value = "";

  alert("تم حفظ النقاط بنجاح ✅");

  loadCustomers();
}


/* حماية عرض الاسم */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* تشغيل أول مرة */

loadCustomers();

</script>

</body>
</html>
