<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسار | لوحة صاحب المحل</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f6fa;
  color:#222;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 4px 18px #00000010;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

h1{
  margin:6px 0;
  font-size:28px;
}

h2{
  margin-top:0;
}

.muted{
  color:#777;
  font-size:13px;
}

.badge{
  background:#eee;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:16px 0;
}

.num{
  font-size:30px;
  font-weight:bold;
  margin-top:8px;
}

input,
button{
  width:100%;
  padding:13px;
  border-radius:11px;
  font-size:16px;
  margin-top:9px;
}

input{
  border:1px solid #ddd;
  background:#fff;
  outline:none;
}

input:focus{
  border-color:#777;
}

button{
  border:0;
  background:#222;
  color:#fff;
  cursor:pointer;
}

button.green{
  background:#159447;
}

button.red{
  background:#d92d20;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.customer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid #eee;
  padding:14px 4px;
}

.customer-info{
  min-width:0;
}

.customer-name{
  font-weight:bold;
  font-size:17px;
}

.customer-phone{
  color:#777;
  margin-top:5px;
  direction:ltr;
  text-align:right;
}

.points{
  white-space:nowrap;
  font-weight:bold;
}

.search-result{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-top:1px solid #eee;
  padding:14px 5px;
  cursor:pointer;
}

.search-result:hover{
  background:#f7f7f7;
}

.status{
  display:none;
  padding:12px;
  margin-top:12px;
  border-radius:10px;
  white-space:pre-wrap;
  word-break:break-word;
}

.status.ok{
  display:block;
  color:#067647;
  background:#ecfdf3;
}

.status.error{
  display:block;
  color:#b42318;
  background:#fef3f2;
}

.loading{
  color:#777;
  padding:12px 0;
}

.empty{
  color:#777;
  padding:12px 0;
}

/* سجل النقاط */

.history-item{
  border-top:1px solid #eee;
  padding:14px 4px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
}

.history-name{
  font-weight:bold;
}

.history-add{
  color:#067647;
  font-weight:bold;
}

.history-remove{
  color:#b42318;
  font-weight:bold;
}

.history-meta{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

.history-date{
  direction:ltr;
  text-align:right;
}

@media(max-width:650px){

  .grid{
    grid-template-columns:1fr;
  }

  .row{
    grid-template-columns:1fr;
  }

  .top{
    align-items:flex-start;
  }

  h1{
    font-size:23px;
  }

  .customer,
  .search-result,
  .history-top{
    align-items:flex-start;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- رأس الصفحة -->

  <div class="top">

    <div>

      <div class="muted">
        مسار • لوحة صاحب المحل
      </div>

      <h1>
        محل مسار التجريبي
      </h1>

    </div>

    <div class="badge">
      Supabase
    </div>

  </div>


  <!-- الإحصائيات -->

  <div class="grid">

    <div class="card">

      <div class="muted">
        عدد الزبائن
      </div>

      <div class="num" id="count">
        0
      </div>

    </div>


    <div class="card">

      <div class="muted">
        إجمالي النقاط
      </div>

      <div class="num" id="total">
        0
      </div>

    </div>


    <div class="card">

      <div class="muted">
        المكافأة القادمة
      </div>

      <div class="num">
        100
      </div>

    </div>

  </div>


  <!-- البحث -->

  <div class="card">

    <h2>
      🔎 البحث عن زبون سابق
    </h2>

    <input
      id="searchName"
      type="text"
      placeholder="اكتب اسم الزبون للبحث"
      oninput="searchCustomers()"
    >

    <div id="searchResults"></div>

  </div>


  <!-- إضافة وخصم -->

  <div class="card">

    <h2>
      إضافة زبون / تحديث النقاط
    </h2>

    <input
      id="name"
      type="text"
      placeholder="اسم الزبون"
    >

    <input
      id="phone"
      type="text"
      placeholder="رقم الهاتف"
      inputmode="tel"
    >

    <input
      id="points"
      type="number"
      min="1"
      placeholder="عدد النقاط"
    >

    <div class="row">

      <button
        class="green"
        onclick="changePoints(1)"
      >
        ➕ إضافة نقاط
      </button>

      <button
        class="red"
        onclick="changePoints(-1)"
      >
        ➖ خصم نقاط
      </button>

    </div>

    <div
      id="status"
      class="status"
    ></div>

  </div>


  <!-- قائمة الزبائن -->

  <div class="card">

    <h2>
      الزبائن
    </h2>

    <div
      id="list"
      class="loading"
    >
      جارِ تحميل الزبائن...
    </div>

  </div>


  <!-- سجل النقاط -->

  <div class="card">

    <h2>
      🧾 سجل النقاط
    </h2>

    <div
      id="historyList"
      class="loading"
    >
      جارِ تحميل السجل...
    </div>

  </div>


  <!-- المكافآت -->

  <div class="card">

    <h2>
      المكافآت
    </h2>

    <div class="customer">

      <div>
        خصم 10%
      </div>

      <div class="points">
        100 نقطة
      </div>

    </div>


    <div class="customer">

      <div>
        هدية مجانية
      </div>

      <div class="points">
        200 نقطة
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   إعداد Supabase
===================================================== */

const SUPABASE_URL =
"https://zobsoaasyuqtqniwfcyd.supabase.co";


const SUPABASE_KEY =
"sb_publishable_nYrJznGU551mw5fMvr6oZA_AySYi2E7";


const SHOP_ID = 1;


/* =====================================================
   متغيرات البرنامج
===================================================== */

let customers = [];

let history = [];


/* =====================================================
   الاتصال بـ Supabase
===================================================== */

async function supabaseRequest(
  endpoint,
  options = {}
){

  const response =
    await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      endpoint,
      {
        ...options,

        headers:{
          "apikey":SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation",

          ...(options.headers || {})
        }
      }
    );


  const text =
    await response.text();


  let data = null;


  try{

    data =
      text
      ? JSON.parse(text)
      : null;

  }

  catch{

    data = text;

  }


  if(!response.ok){

    let message = "";


    if(
      typeof data === "object" &&
      data !== null
    ){

      message =
        data.message ||
        data.msg ||
        data.hint ||
        data.details ||
        JSON.stringify(data);

    }

    else{

      message =
        String(data);

    }


    throw new Error(
      "Supabase " +
      response.status +
      ":\n" +
      message
    );

  }


  return data;

}


/* =====================================================
   تحميل الزبائن
===================================================== */

async function loadCustomers(){

  const list =
    document.getElementById("list");


  list.className =
    "loading";


  list.textContent =
    "جارِ تحميل الزبائن...";


  try{

    customers =
      await supabaseRequest(
        "customers" +
        "?shop_id=eq." +
        SHOP_ID +
        "&select=id,created_at,shop_id,name,phone,points" +
        "&order=id.asc"
      );


    if(!Array.isArray(customers)){

      customers = [];

    }


    renderCustomers();

  }

  catch(error){

    console.error(error);


    list.className =
      "empty";


    list.innerHTML =
      "ما قدرنا نقرأ الزبائن من Supabase." +
      "<br><br>" +
      "<b>الخطأ:</b><br>" +
      escapeHtml(
        error.message
      );

  }

}


/* =====================================================
   عرض الزبائن
===================================================== */

function renderCustomers(){

  const count =
    document.getElementById("count");


  const total =
    document.getElementById("total");


  const list =
    document.getElementById("list");


  count.textContent =
    customers.length;


  total.textContent =
    customers.reduce(
      (sum, customer) =>
        sum +
        Number(
          customer.points || 0
        ),
      0
    );


  if(customers.length === 0){

    list.className =
      "empty";

    list.textContent =
      "لا يوجد زبائن.";

    return;

  }


  list.className =
    "";


  list.innerHTML =
    customers
      .map(customer => {

        const name =
          escapeHtml(
            customer.name || ""
          );


        const phone =
          escapeHtml(
            customer.phone || ""
          );


        const points =
          Number(
            customer.points || 0
          );


        return `

          <div class="customer">

            <div class="customer-info">

              <div class="customer-name">
                ${name}
              </div>

              <div class="customer-phone">
                ${phone}
              </div>

            </div>

            <div class="points">
              ${points} نقطة
            </div>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   البحث عن الزبون بالاسم
===================================================== */

function searchCustomers(){

  const input =
    document.getElementById(
      "searchName"
    );


  const results =
    document.getElementById(
      "searchResults"
    );


  const query =
    input.value
      .trim()
      .toLowerCase();


  if(!query){

    results.innerHTML =
      "";

    return;

  }


  const matches =
    customers.filter(
      customer =>
        String(
          customer.name || ""
        )
        .toLowerCase()
        .includes(query)
    );


  if(matches.length === 0){

    results.innerHTML =
      '<div class="empty">' +
      'ماكو زبون بهذا الاسم.' +
      '</div>';

    return;

  }


  /*
     إذا أكثر من زبون بنفس الاسم
     يظهر كل واحد ورقمه.
  */

  results.innerHTML =
    matches
      .map(customer => {

        const id =
          Number(customer.id);


        const name =
          escapeHtml(
            customer.name || ""
          );


        const phone =
          escapeHtml(
            customer.phone || ""
          );


        const points =
          Number(
            customer.points || 0
          );


        return `

          <div
            class="search-result"
            onclick="selectCustomer(${id})"
          >

            <div>

              <b>
                ${name}
              </b>

              <br>

              <small>
                ${phone}
              </small>

            </div>

            <b>
              ${points} نقطة
            </b>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   اختيار زبون من البحث
===================================================== */

function selectCustomer(id){

  const customer =
    customers.find(
      item =>
        Number(item.id) ===
        Number(id)
    );


  if(!customer){

    return;

  }


  document.getElementById(
    "name"
  ).value =
    customer.name || "";


  document.getElementById(
    "phone"
  ).value =
    customer.phone || "";


  document.getElementById(
    "searchName"
  ).value =
    "";


  document.getElementById(
    "searchResults"
  ).innerHTML =
    "";


  document.getElementById(
    "points"
  ).focus();

}


/* =====================================================
   إضافة العملية إلى points_history
===================================================== */

async function addHistory(
  customerId,
  customerName,
  customerPhone,
  points,
  action
){

  return await supabaseRequest(
    "points_history",
    {
      method:"POST",

      body:JSON.stringify({

        shop_id:SHOP_ID,

        customer_id:
          customerId,

        customer_name:
          customerName,

        customer_phone:
          customerPhone,

        points:
          Number(points),

        action:
          action,

        created_at:
          new Date().toISOString()

      })

    }
  );

}


/* =====================================================
   إضافة أو خصم النقاط
===================================================== */

async function changePoints(
  direction
){

  const name =
    document.getElementById(
      "name"
    )
    .value
    .trim();


  const phone =
    document.getElementById(
      "phone"
    )
    .value
    .trim();


  const points =
    Number(
      document.getElementById(
        "points"
      ).value
    );


  if(!name){

    showStatus(
      "اكتب اسم الزبون.",
      true
    );

    return;

  }


  if(!phone){

    showStatus(
      "اكتب رقم الهاتف.",
      true
    );

    return;

  }


  if(
    !Number.isFinite(points) ||
    points <= 0
  ){

    showStatus(
      "اكتب عدد نقاط صحيح.",
      true
    );

    return;

  }


  try{

    /*
       نبحث عن الزبون بواسطة
       رقم الهاتف + المحل
    */

    const found =
      await supabaseRequest(
        "customers" +
        "?shop_id=eq." +
        SHOP_ID +
        "&phone=eq." +
        encodeURIComponent(phone) +
        "&select=id,name,phone,points"
      );


    let customerId =
      null;


    let newPoints =
      points;


    /* =================================================
       الزبون موجود
    ================================================= */

    if(found.length > 0){

      const customer =
        found[0];


      customerId =
        customer.id;


      const oldPoints =
        Number(
          customer.points || 0
        );


      newPoints =
        Math.max(
          0,
          oldPoints +
          (
            direction *
            points
          )
        );


      /*
         تحديث جدول customers
      */

      await supabaseRequest(
        "customers" +
        "?id=eq." +
        customer.id +
        "&shop_id=eq." +
        SHOP_ID,
        {
          method:"PATCH",

          body:JSON.stringify({

            name:name,

            phone:phone,

            points:newPoints

          })

        }
      );

    }


    /* =================================================
       الزبون غير موجود
    ================================================= */

    else{

      /*
         لا نسمح بالخصم من زبون
         غير مسجل.
      */

      if(direction === -1){

        showStatus(
          "هذا الزبون غير موجود.\n" +
          "ما يصير نخصم نقاط من زبون غير مسجل.",
          true
        );

        return;

      }


      /*
         إنشاء زبون جديد
      */

      const created =
        await supabaseRequest(
          "customers",
          {
            method:"POST",

            body:JSON.stringify({

              shop_id:
                SHOP_ID,

              name:
                name,

              phone:
                phone,

              points:
                points

            })

          }
        );


      if(
        Array.isArray(created) &&
        created.length > 0
      ){

        customerId =
          created[0].id;

      }


      newPoints =
        points;

    }


    /* =================================================
       تسجيل العملية في points_history
    ================================================= */

    const action =
      direction === 1
      ? "add"
      : "remove";


    try{

      await addHistory(
        customerId,
        name,
        phone,
        points,
        action
      );

    }

    catch(historyError){

      console.error(
        historyError
      );


      /*
         الزبون تم تحديثه،
         لكن سجل العملية فشل.
      */

      showStatus(
        "تم تحديث رصيد الزبون، " +
        "لكن تعذر تسجيل العملية في السجل.\n\n" +
        historyError.message,
        true
      );


      await loadCustomers();

      await loadHistory();

      return;

    }


    /* =================================================
       رسالة النجاح
    ================================================= */

    if(direction === 1){

      showStatus(
        "تمت إضافة " +
        points +
        " نقطة.\n" +
        "الرصيد الجديد: " +
        newPoints +
        " نقطة.",
        false
      );

    }

    else{

      showStatus(
        "تم خصم " +
        points +
        " نقطة.\n" +
        "الرصيد الجديد: " +
        newPoints +
        " نقطة.",
        false
      );

    }


    /*
       تنظيف خانة النقاط
    */

    document.getElementById(
      "points"
    ).value =
      "";


    /*
       تحديث قائمة الزبائن
    */

    await loadCustomers();


    /*
       تحديث البحث
    */

    searchCustomers();


    /*
       تحديث السجل
    */

    await loadHistory();

  }

  catch(error){

    console.error(error);


    showStatus(
      "حدث خطأ أثناء العملية:\n\n" +
      error.message,
      true
    );

  }

}


/* =====================================================
   تحميل سجل النقاط
===================================================== */

async function loadHistory(){

  const list =
    document.getElementById(
      "historyList"
    );


  list.className =
    "loading";


  list.textContent =
    "جارِ تحميل السجل...";


  try{

    history =
      await supabaseRequest(
        "points_history" +
        "?shop_id=eq." +
        SHOP_ID +
        "&select=id,created_at,shop_id,customer_id,customer_name,customer_phone,points,action" +
        "&order=id.desc"
      );


    if(!Array.isArray(history)){

      history = [];

    }


    renderHistory();

  }

  catch(error){

    console.error(error);


    list.className =
      "empty";


    list.innerHTML =
      "ما قدرنا نقرأ سجل النقاط." +
      "<br><br>" +
      "<b>الخطأ:</b><br>" +
      escapeHtml(
        error.message
      );

  }

}


/* =====================================================
   عرض سجل النقاط
===================================================== */

function renderHistory(){

  const list =
    document.getElementById(
      "historyList"
    );


  if(history.length === 0){

    list.className =
      "empty";

    list.textContent =
      "لا توجد عمليات بالنقاط بعد.";

    return;

  }


  list.className =
    "";


  list.innerHTML =
    history
      .map(item => {

        const name =
          escapeHtml(
            item.customer_name || ""
          );


        const phone =
          escapeHtml(
            item.customer_phone || ""
          );


        const points =
          Number(
            item.points || 0
          );


        const action =
          String(
            item.action || ""
          )
          .toLowerCase();


        const isAdd =
          action === "add" ||
          action === "addition" ||
          action === "إضافة";


        const actionText =
          isAdd
          ? "➕ إضافة"
          : "➖ خصم";


        const actionClass =
          isAdd
          ? "history-add"
          : "history-remove";


        const dateText =
          formatDate(
            item.created_at
          );


        return `

          <div class="history-item">

            <div class="history-top">

              <div>

                <div class="history-name">
                  ${name}
                </div>

                <div class="history-meta">
                  ${phone}
                </div>

              </div>


              <div
                class="${actionClass}"
              >
                ${actionText}
                ${points}
                نقطة
              </div>

            </div>


            <div
              class="history-meta history-date"
            >
              ${dateText}
            </div>

          </div>

        `;

      })
      .join("");

}


/* =====================================================
   تنسيق التاريخ والوقت
===================================================== */

function formatDate(value){

  if(!value){

    return "بدون تاريخ";

  }


  const date =
    new Date(value);


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return escapeHtml(
      value
    );

  }


  return date.toLocaleString(
    "ar-IQ",
    {
      year:"numeric",
      month:"2-digit",
      day:"2-digit",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}


/* =====================================================
   رسالة الحالة
===================================================== */

function showStatus(
  message,
  isError
){

  const status =
    document.getElementById(
      "status"
    );


  status.textContent =
    message;


  status.className =
    "status " +
    (
      isError
      ? "error"
      : "ok"
    );

}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(value){

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,

    );

}
