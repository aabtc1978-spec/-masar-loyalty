<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مسار | لوحة صاحب المحل</title>

<style>
body{margin:0;background:#f5f6fa;color:#202124;font-family:Arial,sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.muted{color:#777;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 3px 16px #0000000d}
.num{font-size:30px;font-weight:700;margin-top:8px}
input,button{width:100%;padding:12px;border-radius:10px;margin-top:9px;font-size:15px;box-sizing:border-box}
input{border:1px solid #ddd}
button{border:0;background:#111;color:#fff}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.customer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:12px 0}
.badge{padding:5px 9px;border-radius:20px;background:#eee}

.search-result{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #eee;
padding:12px 0;
cursor:pointer;
}

.search-result:hover{
background:#f7f7f7;
}

.search-box{
margin-bottom:8px;
}

#searchResults:empty{
display:none;
}

@media(max-width:650px){
.grid{grid-template-columns:1fr}
.row{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">
<div>
<div class="muted">مسار • لوحة التحكم</div>
<h1>محل مسار التجريبي</h1>
</div>
<div class="badge">تجريبي</div>
</div>


<div class="grid">

<div class="card">
<div class="muted">عدد الزبائن</div>
<div class="num" id="count">0</div>
</div>

<div class="card">
<div class="muted">إجمالي النقاط</div>
<div class="num" id="total">0</div>
</div>

<div class="card">
<div class="muted">المكافأة القادمة</div>
<div class="num">100</div>
</div>

</div>


<!-- البحث -->

<div class="card">

<h2>البحث عن زبون سابق</h2>

<input
id="searchName"
class="search-box"
placeholder="اكتب اسم الزبون للبحث"
oninput="searchCustomers()"
>

<div id="searchResults"></div>

</div>


<!-- إضافة وخصم -->

<div class="card">

<h2>إضافة زبون / تحديث نقاط</h2>

<input
id="name"
placeholder="اسم الزبون"
>

<input
id="phone"
placeholder="رقم الهاتف"
>

<input
id="points"
type="number"
placeholder="عدد النقاط"
>

<div class="row">

<button onclick="change(1)">
إضافة نقاط
</button>

<button onclick="change(-1)">
خصم نقاط
</button>

</div>

</div>


<!-- الزبائن -->

<div class="card">

<h2>الزبائن</h2>

<div id="list"></div>

</div>


<!-- المكافآت -->

<div class="card">

<h2>المكافآت</h2>

<div class="customer">
<span>خصم 10%</span>
<b>100 نقطة</b>
</div>

<div class="customer">
<span>هدية مجانية</span>
<b>200 نقطة</b>
</div>

</div>

</div>


<script>

let customers =
JSON.parse(
localStorage.getItem('masar_customers') || '{}'
);


/* =========================
   عرض الزبائن
========================= */

function render(){

let a =
Object.entries(customers);

count.textContent =
a.length;

total.textContent =
a.reduce(
(s,[,c]) => s + Number(c.points || 0),
0
);

list.innerHTML =
a.length

? a.map(([p,c]) => `

<div class="customer">

<span>

<b>
${escapeHtml(c.name)}
</b>

<br>

<small>
${escapeHtml(p)}
</small>

</span>

<b>
${Number(c.points || 0)} نقطة
</b>

</div>

`).join('')

: '<div class="muted">لا يوجد زبائن بعد.</div>';

}


/* =========================
   البحث
========================= */

function searchCustomers(){

let q =
searchName.value
.trim()
.toLowerCase();


if(!q){

searchResults.innerHTML = '';

return;

}


let matches =
Object.entries(customers)
.filter(([p,c]) =>

String(c.name || '')
.toLowerCase()
.includes(q)

);


if(!matches.length){

searchResults.innerHTML =
'<div class="muted">لا يوجد زبون بهذا الاسم.</div>';

return;

}


searchResults.innerHTML =
matches.map(([p,c]) => `

<div
class="search-result"
onclick="selectCustomer('${escapeJs(p)}')"
>

<span>

<b>
${escapeHtml(c.name)}
</b>

<br>

<small>
${escapeHtml(p)}
</small>

</span>

<b>
${Number(c.points || 0)} نقطة
</b>

</div>

`).join('');

}


/* =========================
   اختيار الزبون
========================= */

function selectCustomer(phone){

let c =
customers[phone];

if(!c)
return;


name.value =
c.name || '';

document.getElementById('phone')
.value =
phone;


searchName.value = '';

searchResults.innerHTML = '';


document.getElementById('points')
.focus();

}


/* =========================
   إضافة / خصم
========================= */

function change(dir){

let n =
name.value.trim();

let p =
phone.value.trim();

let v =
Number(points.value);


if(!n || !p || !v){

alert(
'أدخل الاسم والرقم والنقاط'
);

return;

}


if(!customers[p]){

customers[p] = {

name:n,

points:0

};

}


customers[p].name =
n;


customers[p].points =
Math.max(
0,
Number(customers[p].points || 0)
+
dir * v
);


localStorage.setItem(
'masar_customers',
JSON.stringify(customers)
);


points.value = '';

render();

}


/* =========================
   حماية النص
========================= */

function escapeHtml(value){

return String(value)

.replaceAll('&','&amp;')

.replaceAll('<','&lt;')

.replaceAll('>','&gt;')

.replaceAll('"','&quot;')

.replaceAll("'","&#039;");

}


/* =========================
   حماية رقم الهاتف
========================= */

function escapeJs(value){

return String(value)

.replaceAll('\\','\\\\')

.replaceAll("'","\\'");

}


/* =========================
   تشغيل
========================= */

render();

</script>

</body>
</html>
