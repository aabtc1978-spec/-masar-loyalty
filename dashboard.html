<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>مسار | لوحة صاحب المحل</title>

<style>
body{
margin:0;
background:#f5f6fa;
color:#202124;
font-family:Arial,sans-serif
}

.wrap{
max-width:1000px;
margin:auto;
padding:20px
}

.top{
display:flex;
justify-content:space-between;
align-items:center
}

.muted{
color:#777;
font-size:13px
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:12px;
margin:18px 0
}

.card{
background:#fff;
border-radius:16px;
padding:18px;
margin:12px 0;
box-shadow:0 3px 16px #0000000d
}

.num{
font-size:30px;
font-weight:700;
margin-top:8px
}

input,button{
width:100%;
padding:12px;
border-radius:10px;
margin-top:9px;
font-size:15px;
box-sizing:border-box
}

input{
border:1px solid #ddd;
background:#fff
}

button{
border:0;
background:#111;
color:#fff;
cursor:pointer
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.customer{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #eee;
padding:13px 0
}

.badge{
padding:5px 9px;
border-radius:20px;
background:#eee
}

.search-result{
display:flex;
justify-content:space-between;
align-items:center;
border-top:1px solid #eee;
padding:13px 5px;
cursor:pointer
}

.search-result:hover{
background:#f5f5f5
}

.green{
background:#159447
}

.red{
background:#d92d20
}

.status{
padding:10px;
border-radius:10px;
background:#f1f1f1;
margin-top:10px;
display:none
}

@media(max-width:650px){
.grid{
grid-template-columns:1fr
}

.row{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<div class="wrap">

<div class="top">

<div>
<div class="muted">مسار • لوحة صاحب المحل</div>
<h1>محل مسار التجريبي</h1>
</div>

<div class="badge">
Supabase
</div>

</div>


<!-- الإحصائيات -->

<div class="grid">

<div class="card">
<div class="muted">عدد الزبائن</div>
<div class="num" id="count">0</div>
</div>

<div class="card">
<div class="muted">إجمالي النقاط</div>
<div class="num" id="total">0</div>
</div>

<div class="card">
<div class="muted">المكافأة القادمة</div>
<div class="num">100</div>
</div>

</div>


<!-- البحث -->

<div class="card">

<h2>🔎 البحث عن زبون سابق</h2>

<input
id="searchName"
placeholder="اكتب اسم الزبون"
oninput="searchCustomers()"
>

<div id="searchResults"></div>

</div>


<!-- إضافة وخصم -->

<div class="card">

<h2>إضافة زبون / تحديث نقاط</h2>

<input
id="name"
placeholder="اسم الزبون"
>

<input
id="phone"
placeholder="رقم الهاتف"
>

<input
id="points"
type="number"
placeholder="عدد النقاط"
>

<div class="row">

<button
class="green"
onclick="changePoints(1)"
>
➕ إضافة نقاط
</button>

<button
class="red"
onclick="changePoints(-1)"
>
➖ خصم نقاط
</button>

</div>

<div
id="status"
class="status"
></div>

</div>


<!-- الزبائن -->

<div class="card">

<h2>الزبائن</h2>

<div id="list">
جارِ تحميل الزبائن...
</div>

</div>


<!-- المكافآت -->

<div class="card">

<h2>المكافآت</h2>

<div class="customer">
<span>خصم 10%</span>
<b>100 نقطة</b>
</div>

<div class="customer">
<span>هدية مجانية</span>
<b>200 نقطة</b>
</div>

</div>

</div>


<script>

/* ==============================
   إعداد Supabase
============================== */

const SUPABASE_URL =
"https://zobsoaasyuqtqniwfcyd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nYrJznGU551mw5fMvr6oZA_AySYi2E7";

const SHOP_ID = 1;


/* ==============================
   طلب إلى Supabase REST API
============================== */

async function supabaseRequest(
url,
options={}
){

const response =
await fetch(
SUPABASE_URL + "/rest/v1/" + url,
{
...options,

headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer " + SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":"return=representation",
...(options.headers || {})
}
}
);

const text =
await response.text();

let data;

try{
data =
text ? JSON.parse(text) : null;
}
catch{
data = text;
}

if(!response.ok){

throw new Error(
typeof data === "string"
?
data
:
JSON.stringify(data)
);

}

return data;

}


/* ==============================
   تحميل الزبائن
============================== */

let customers = [];


async function loadCustomers(){

try{

customers =
await supabaseRequest(
"customers?shop_id=eq." +
SHOP_ID +
"&select=id,created_at,shop_id,name,phone,points&order=id.asc"
);

renderCustomers();

}
catch(error){

console.error(error);

document.getElementById("list").innerHTML =
`
<div style="color:red">
حدث خطأ أثناء تحميل الزبائن:
<br><br>
${escapeHtml(error.message)}
</div>
`;

}

}


/* ==============================
   عرض الزبائن
============================== */

function renderCustomers(){

const count =
document.getElementById("count");

const total =
document.getElementById("total");

const list =
document.getElementById("list");


count.textContent =
customers.length;


total.textContent =
customers.reduce(
(sum,c) =>
sum + Number(c.points || 0),
0
);


if(!customers.length){

list.innerHTML =
'<div class="muted">لا يوجد زبائن.</div>';

return;

}


list.innerHTML =
customers.map(c => `

<div class="customer">

<div>

<b>
${escapeHtml(c.name || "")}
</b>

<br>

<small>
${escapeHtml(c.phone || "")}
</small>

</div>

<b>
${Number(c.points || 0)} نقطة
</b>

</div>

`).join("");

}


/* ==============================
   البحث بالاسم
============================== */

function searchCustomers(){

const q =
document
.getElementById("searchName")
.value
.trim()
.toLowerCase();


const results =
document.getElementById("searchResults");


if(!q){

results.innerHTML = "";

return;

}


const matches =
customers.filter(c =>
String(c.name || "")
.toLowerCase()
.includes(q)
);


if(!matches.length){

results.innerHTML =
'<div class="muted">ماكو زبون بهذا الاسم.</div>';

return;

}


results.innerHTML =
matches.map(c => `

<div
class="search-result"
onclick="selectCustomer(${Number(c.id)})"
>

<div>

<b>
${escapeHtml(c.name || "")}
</b>

<br>

<small>
${escapeHtml(c.phone || "")}
</small>

</div>

<b>
${Number(c.points || 0)} نقطة
</b>

</div>

`).join("");

}


/* ==============================
   اختيار زبون
============================== */

function selectCustomer(id){

const customer =
customers.find(
c => Number(c.id) === Number(id)
);

if(!customer)
return;


document.getElementById("name")
.value =
customer.name || "";


document.getElementById("phone")
.value =
customer.phone || "";


document.getElementById("searchName")
.value = "";


document.getElementById("searchResults")
.innerHTML = "";


document.getElementById("points")
.focus();

}


/* ==============================
   إضافة أو خصم نقاط
============================== */

async function changePoints(direction){

const name =
document.getElementById("name")
.value
.trim();

const phone =
document.getElementById("phone")
.value
.trim();

const points =
Number(
document.getElementById("points")
.value
);


if(!name || !phone || !points){

showStatus(
"أدخل اسم الزبون ورقم الهاتف وعدد النقاط.",
true
);

return;

}


try{

/*
نبحث عن الزبون بواسطة
رقم الهاتف + المحل
*/

const found =
await supabaseRequest(
"customers?shop_id=eq." +
SHOP_ID +
"&phone=eq." +
encodeURIComponent(phone) +
"&select=id,name,phone,points"
);


let customer;


if(found.length){

customer =
found[0];

const oldPoints =
Number(customer.points || 0);

const newPoints =
Math.max(
0,
oldPoints + direction * points
);


/*
تحديث رصيد الزبون
*/

await supabaseRequest(
"customers?id=eq." +
customer.id +
"&shop_id=eq." +
SHOP_ID,
{
method:"PATCH",

body:JSON.stringify({
name:name,
phone:phone,
points:newPoints
})
}
);


/*
إظهار النتيجة
*/

showStatus(
direction === 1
?
`تمت إضافة ${points} نقطة. الرصيد الجديد: ${newPoints}`
:
`تم خصم ${points} نقطة. الرصيد الجديد: ${newPoints}`,
false
);

}
else{

/*
إذا الزبون غير موجود:
الإضافة تنشئ زبون جديد
*/

if(direction === -1){

showStatus(
"هذا الزبون غير موجود، ما يصير خصم منه.",
true
);

return;

}


const created =
await supabaseRequest(
"customers",
{
method:"POST",

body:JSON.stringify({
shop_id:SHOP_ID,
name:name,
phone:phone,
points:points
})
}
);


const newPoints =
Number(created?.
