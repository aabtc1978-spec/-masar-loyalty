<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مسار | لوحة التحكم</title>

<style>
body{
  margin:0;
  background:#f5f6fa;
  color:#202124;
  font-family:Arial,sans-serif;
}
.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
h1{
  margin:0;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #ddd;
}
.num{
  font-size:32px;
  font-weight:bold;
  margin-top:8px;
}
input,button{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  margin-top:10px;
  border-radius:8px;
  font-size:16px;
}
input{
  border:1px solid #ccc;
}
button{
  border:0;
  background:#333;
  color:white;
  cursor:pointer;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.customer{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-top:1px solid #eee;
  padding:14px 0;
}
.muted{
  color:#777;
}
.status{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  background:#f1f1f1;
}
@media(max-width:650px){
  .grid{
    grid-template-columns:1fr;
  }
  .top{
    display:block;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="top">
    <div class="muted">مسار • لوحة التحكم</div>
    <h1>محل مسار التجريبي</h1>
  </div>

  <div class="grid">

    <div class="card">
      <div class="muted">عدد الزبائن</div>
      <div class="num" id="count">0</div>
    </div>

    <div class="card">
      <div class="muted">إجمالي النقاط</div>
      <div class="num" id="total">0</div>
    </div>

    <div class="card">
      <div class="muted">المكافأة القادمة</div>
      <div class="num">100</div>
    </div>

  </div>

  <div class="card">

    <h2>إضافة زبون / تحديث نقاط</h2>

    <input id="name" placeholder="اسم الزبون">

    <input id="phone" placeholder="رقم الهاتف">

    <input id="points" type="number" placeholder="عدد النقاط">

    <div class="row">
      <button onclick="changePoints(1)">إضافة نقاط</button>
      <button onclick="changePoints(-1)">خصم نقاط</button>
    </div>

    <div id="status" class="status">جاهز</div>

  </div>

  <div class="card">

    <h2>الزبائن</h2>

    <div id="list">
      جارِ التحميل...
    </div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://zobsoaasyuqtqniwfcyd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nYrJznGU551mw5fMvr6oZA_AySYi2E7";

const TABLE = "customers";


async function getCustomers(){

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/" +
    TABLE +
    "?select=id,name,phone,points,created_at&order=id.desc",
    {
      method:"GET",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer " + SUPABASE_KEY
      }
    }
  );

  if(!response.ok){

    const errorText = await response.text();

    throw new Error(errorText || "فشل تحميل الزبائن");
  }

  return await response.json();
}


async function render(){

  try{

    const customers = await getCustomers();

    document.getElementById("count").textContent =
      customers.length;

    let total = 0;

    customers.forEach(c=>{
      total += Number(c.points || 0);
    });

    document.getElementById("total").textContent = total;

    const list = document.getElementById("list");

    if(customers.length === 0){

      list.innerHTML =
        '<div class="muted">لا يوجد زبائن حالياً</div>';

      return;
    }

    list.innerHTML = customers.map(c => `

      <div class="customer">

        <div>
          <b>${escapeHtml(c.name || "")}</b>
          <div class="muted">${escapeHtml(c.phone || "")}</div>
        </div>

        <div>
          <b>${Number(c.points || 0)}</b> نقطة
        </div>

      </div>

    `).join("");

  }catch(error){

    console.error(error);

    document.getElementById("list").innerHTML =
      "<div class='muted'>تعذر تحميل البيانات</div>";

    document.getElementById("status").textContent =
      "خطأ: " + error.message;
  }
}

    document.getElementById("phone").value.trim();

  const points =
    Number(document.getElementById("points").value);

  const status =
    document.getElementById("status");


  if(!name || !phone || !points || points <= 0){

    status.textContent =

  }

      encodeURIComponent(phone),
      {
        method:"GET",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );


    if(!searchResponse.ok){

      throw new Error(
        await searchResponse.text()
      );
    }


    const found =
      await searchResponse.json();


    if(found.length === 0){

      // إنشاء زبون جديد
      const newPoints =
        direction === 1 ? points : 0;


      const insertResponse = await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        TABLE,
        {
          method:"POST",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer " + SUPABASE_KEY,
            "Content-Type":"application/json",
            "Prefer":"return=representation"
          },

          body:JSON.stringify({
            name:name,
            phone:phone,
            points:newPoints
          })
        }
      );


      if(!insertResponse.ok){

        throw new Error(
          await insertResponse.text()
        );
      }


    }else{

      // تحديث زبون موجود
      const customer = found[0];

      const oldPoints =
        Number(customer.points || 0);

      const newPoints =
        Math.max(
          0,
          oldPoints + (direction * points)
        );


      const updateResponse = await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        TABLE +
        "?id=eq." +
        customer.id,
        {
          method:"PATCH",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer " + SUPABASE_KEY,
            "Content-Type":"application/json",
            "Prefer":"return=representation"
          },

          body:JSON.stringify({
            name:name,
            phone:phone,
            points:newPoints
          })
        }
      );


      if(!updateResponse.ok){
